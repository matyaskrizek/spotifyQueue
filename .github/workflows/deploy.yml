name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["master"]   # use your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets — Settings → Secrets and variables → Actions → Secrets
      VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      VITE_WALLS_DANCE_API_KEY: ${{ secrets.WALLS_DANCE_API_KEY }}
      # Non-secrets — Settings → Secrets and variables → Actions → Variables
      # Default westwood; set WALLS_BAR to override without a workflow change.
      VITE_WALLS_BAR: ${{ vars.WALLS_BAR || 'westwood' }}
      # Cloudflare Worker origin, e.g. https://spotifyqueue.matyask99.workers.dev
      VITE_WALLS_API_BASE: ${{ vars.WALLS_API_BASE }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}